<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="900" height="640" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="17" font-weight="bold">swift run SequentialContrastDemo &#8212; real captured output</text>

  <rect x="24" y="50" width="852" height="182" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="74" fill="#d29922" font-size="12" font-weight="bold">1. Overlapping marginals, and a difference that still excludes zero</text>
  <text x="40" y="96" fill="#8b949e" font-size="11">tally&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;both 66, A only 12, B only 0, neither 42</text>
  <text x="40" y="114" fill="#8b949e" font-size="11">arm A&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[0.494198, 0.786683] after 78/120</text>
  <text x="40" y="132" fill="#8b949e" font-size="11">arm B&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;[0.394963, 0.698705] after 66/120</text>
  <text x="40" y="150" fill="#8b949e" font-size="11">marginals overlap&#160;&#160;&#160;true</text>
  <text x="40" y="172" fill="#a371f7" font-size="11">unpaired difference&#160;[-0.204507, +0.391720]&#160;&#160;&#160;excludes zero&#160;&#160;false</text>
  <text x="40" y="192" fill="#3fb950" font-size="11">paired difference&#160;&#160;&#160;&#160;[+0.005623, +0.224426]&#160;&#160;&#160;excludes zero&#160;&#160;true</text>
  <text x="40" y="214" fill="#8b949e" font-size="11">first exclusion trial 110&#160;&#160;&#160;&#160;&#160;&#160;reference admissible&#160;&#160;false</text>

  <rect x="24" y="246" width="852" height="176" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="270" fill="#d29922" font-size="12" font-weight="bold">5. What the pairing is worth: p_A = 0.70, p_B = 0.58, delta = 0.1200, 80 items</text>
  <text x="40" y="294" fill="#58a6ff" font-size="11">agreement&#160;&#160;&#160;paired width&#160;&#160;&#160;unpaired width&#160;&#160;&#160;gain</text>
  <text x="40" y="314" fill="#8b949e" font-size="11">0.8800&#160;&#160;&#160;&#160;&#160;&#160;0.288488&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.691277&#160;&#160;&#160;&#160;&#160;2.3962x</text>
  <text x="40" y="332" fill="#8b949e" font-size="11">0.8000&#160;&#160;&#160;&#160;&#160;&#160;0.425839&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.691277&#160;&#160;&#160;&#160;&#160;1.6233x</text>
  <text x="40" y="350" fill="#8b949e" font-size="11">0.7000&#160;&#160;&#160;&#160;&#160;&#160;0.523095&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.691277&#160;&#160;&#160;&#160;&#160;1.3215x</text>
  <text x="40" y="368" fill="#8b949e" font-size="11">0.5800&#160;&#160;&#160;&#160;&#160;&#160;0.597685&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.691277&#160;&#160;&#160;&#160;&#160;1.1566x</text>
  <text x="40" y="386" fill="#8b949e" font-size="11">0.4400&#160;&#160;&#160;&#160;&#160;&#160;0.658440&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.691277&#160;&#160;&#160;&#160;&#160;1.0499x</text>
  <text x="40" y="410" fill="#8b949e" font-size="11">the unpaired width never moves &#8212; it cannot see the column on the left</text>

  <rect x="24" y="436" width="852" height="188" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="460" fill="#d29922" font-size="12" font-weight="bold">3 + 4. Exact miscoverage and detection at horizon 60, nominal alpha = 0.05</text>
  <text x="40" y="484" fill="#58a6ff" font-size="11">joint&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;delta&#160;&#160;&#160;&#160;paired miss&#160;&#160;&#160;unpaired miss&#160;&#160;&#160;paired detect&#160;&#160;&#160;unpaired detect</text>
  <text x="40" y="504" fill="#8b949e" font-size="11">agree 0.88&#160;&#160;&#160;&#160;0.0800&#160;&#160;&#160;0.000011&#160;&#160;&#160;&#160;&#160;&#160;0.000000&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.060313&#160;&#160;&#160;&#160;&#160;&#160;&#160;0.000000</text>
  <text x="40" y="522" fill="#8b949e" font-size="11">agree 0.70&#160;&#160;&#160;&#160;0.1000&#160;&#160;&#160;0.000940&#160;&#160;&#160;&#160;&#160;&#160;0.000000</text>
  <text x="40" y="540" fill="#8b949e" font-size="11">agree 0.50&#160;&#160;&#160;&#160;0.1000&#160;&#160;&#160;0.002842&#160;&#160;&#160;&#160;&#160;&#160;0.000080</text>
  <text x="40" y="566" fill="#8b949e" font-size="11">both constructions spend far less than the budget they were given: the paired one</text>
  <text x="40" y="584" fill="#8b949e" font-size="11">reaches 5.68% of alpha at its worst, the unpaired one is essentially never wrong &#8212;</text>
  <text x="40" y="602" fill="#e6edf3" font-size="11">and pays for that with a detection rate of 0.000000 against a real 0.08 difference.</text>
  <text x="40" y="620" fill="#8b949e" font-size="11">Conservatism is not free. It is the same slack, priced as blindness instead of width.</text>
</svg>
